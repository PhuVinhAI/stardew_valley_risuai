schema: risuai-world/v1
id: stardew-valley
name: Stardew Valley - Beta 0.1
version: 0.1.0-beta
creator: ""
language: en
tags: [stardew-valley, open-ended-roleplay, pelican-town, all-female-cast, futanari, no-men, explicit, festivals]
nickname: Pelican Town
source:
  - Stardew Valley 1.6.15.24356 (unpacked game data; see docs/CANON_NOTES.md)
  - Mud's Skimpy Portraits (Volumes 1 and 2)
  - OO's Anime Style Skimpy Portraits
prompts:
  description: world/description.md
  personality: world/personality.md
  scenario: world/scenario.md
  exampleMessages: world/example-messages.md
  creatorNotes: world/creator-notes.md
  systemPrompt: world/system-prompt.md
  postHistoryInstructions: world/post-history-instructions.md
startPanel:
  manifest: presentation/start-panel.yaml
  scenarioDir: presentation/scenarios
lorebook:
  # Depth is deliberately shallow, and the scene header is why. Every reply now
  # opens with `[Scene: ... | <who is present>]`, so a resident standing in the
  # room re-triggers her own entry from the single most recent message -- measured
  # at 65 of 65 cast names across every header this card ships. Depth therefore
  # buys only one thing: remembering someone who has LEFT the scene. Five messages
  # covers a resident referred to again shortly after she walked out, which is the
  # case that actually comes up.
  #
  # Measured on this card's own prose, activation saturates at depth 20 and above
  # (39 entries, ~46000 tokens). Depth 5 costs ~22000 in that same worst case, so
  # it halves the ceiling with nothing lost for anyone actually in the scene. Both
  # numbers are upper bounds from crowd scenes; ordinary play with two or three
  # residents measures far lower. The trade is that a resident named six or more
  # messages ago and not named since loses her profile until she is named again --
  # acceptable, because the always-active cast registry still holds her name, and
  # naming her is what pulls the profile back.
  scanDepth: 5
  # A ceiling, not a target. With depth at 5 this never binds in ordinary play; it
  # only decides what happens in a crowd scene naming a dozen residents at once,
  # where dropping a resident who is standing in the room is worse than spending
  # the tokens. Depth is the working limiter -- do not raise depth and leave this
  # value high, because then nothing limits the book at all.
  tokenBudget: 99999
  # Off deliberately. The three always-active entries name every resident, place,
  # festival, and birthday on purpose, so with recursion on, RisuAI rescans their
  # content and activates most of the book on the very first turn -- measured at
  # roughly 77000 tokens before {{user}} has said anything. With recursion off, an
  # entry activates only from what {{user}} and the assistant actually wrote, which
  # is the behaviour the index was designed for: naming a place in prose pulls that
  # place in on the next turn.
  recursiveScanning: false
  # Vietnamese keys are multi-syllable and diacritic-heavy, and RisuAI's
  # word-boundary matcher does not fire on them reliably. Substring matching is
  # what the reference cards use for the same reason.
  fullWordMatching: false
  folders:
    - id: residents
      name: Residents
      kinds: [character]
      insertionOrder: 100
    - id: places
      name: Places
      kinds: [location]
      insertionOrder: 200
    - id: bonds
      name: Bonds and Households
      kinds: [relationship]
      insertionOrder: 300
    - id: festivals
      name: Festivals and Seasons
      kinds: [event]
      insertionOrder: 400
    - id: world-rules
      name: World Rules
      kinds: [lore, system, schedule]
      insertionOrder: 500
module:
  name: Stardew Valley - Pelican Town
  description: RisuAI module for Stardew Valley - Beta 0.1
risuai:
  prebuiltAssetCommand: true
  prebuiltAssetStyle: dynamic
tokenCheck:
  encoding: o200k_base
  # The compiled total counts every scenario body in both languages plus all 81
  # lore entries, but a live session only carries the always-active entries and
  # whatever the recent turns activated -- measured at roughly 10k-15k at the
  # start of a chat. These thresholds guard against runaway growth, not against
  # a context overflow that the lorebook's own 60000 budget already caps.
  warnAt: 140000
  errorAt: 170000
