schema: risuai-portrait-curation/v1
character: jodi
sourcePack: OO's Anime Style Skimpy Portraits
sourceRoot: assets/imported/oo-anime-portraits/jodi
variant: upscaled-2x
outfits:
  default:
    context: adult-private-consensual-only
    defaultEnabled: false
    frames:
      expression-00: warm
      expression-01: amused
      expression-02: weary
      expression-03: exasperated
      expression-04: brisk
      expression-05: unclassified-01
    duplicates: []
  beach:
    context: adult-private-consensual-only
    defaultEnabled: false
    frames: &jodi-frames
      expression-00: warm
      expression-01: amused
      expression-02: weary
      expression-03: exasperated
      expression-04: brisk
    duplicates: []
  winter:
    context: adult-private-consensual-only
    defaultEnabled: false
    frames: *jodi-frames
    duplicates: []
  swimsuit:
    context: adult-private-consensual-only
    defaultEnabled: false
    frames: *jodi-frames
    duplicates:
      - frame: expression-00
        duplicateOf: expression-00
      - frame: expression-01
        duplicateOf: expression-01
      - frame: expression-02
        duplicateOf: expression-02
      - frame: expression-03
        duplicateOf: expression-03
      - frame: expression-04
        duplicateOf: expression-04
