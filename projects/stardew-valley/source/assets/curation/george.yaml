schema: risuai-portrait-curation/v1
character: george
sourcePack: OO's Anime Style Skimpy Portraits
sourceRoot: assets/imported/oo-anime-portraits/george
variant: upscaled-2x
outfits:
  default:
    context: everyday
    frames: &george-frames
      expression-00: sullen
      expression-01: softened
      expression-02: displeased
      expression-03: grumbling
    duplicates: []
  winter:
    context: cold-weather
    frames: *george-frames
    duplicates: []
  beach:
    context: everyday
    frames: *george-frames
    duplicates: &george-dups
      - frame: expression-00
        duplicateOf: expression-00
      - frame: expression-01
        duplicateOf: expression-01
      - frame: expression-02
        duplicateOf: expression-02
      - frame: expression-03
        duplicateOf: expression-03
  swimsuit:
    context: everyday
    frames: *george-frames
    duplicates: *george-dups
