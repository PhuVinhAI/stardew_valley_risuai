schema: risuai-start-panel/v1
sentinel: "[[sv-start-panel]]"
defaultLanguage: en
defaultScenario: road-arrival
variables:
  language: sv_lang
  group: sv_group
  scene: sv_scene
languages:
  - id: en
    label: ENG
  - id: vi
    label: VIỆT
groups:
  - id: arrival
    labels:
      en: Arrival
      vi: Mới đến
  - id: seasons
    labels:
      en: Seasons
      vi: Bốn mùa
  - id: ensemble
    labels:
      en: Ensemble
      vi: Nhiều người
  - id: open
    labels:
      en: Free
      vi: Tự do
ui:
  eyebrow:
    en: STARDEW VALLEY
    vi: STARDEW VALLEY
  title:
    en: Where does your story begin?
    vi: Câu chuyện của bạn bắt đầu ở đâu?
  subtitle:
    en: Every opening is the valley meeting you for the first time. Only the season, hour, place, and company change.
    vi: Mỗi cảnh mở đầu đều là lần đầu thung lũng gặp bạn. Chỉ khác mùa, giờ, địa điểm và người có mặt.
  languageLabel:
    en: Language
    vi: Ngôn ngữ
  groupStep:
    en: Kind of opening
    vi: Kiểu mở đầu
  sceneStep:
    en: Opening scene
    vi: Cảnh mở đầu
  choosePrefix:
    en: Choose
    vi: Chọn
  emptyHint:
    en: No scene chosen yet. Pick one of the cards above.
    vi: Chưa chọn cảnh nào. Hãy bấm một trong các thẻ phía trên.
  footer:
    en: The chosen scene stays for this chat. Select again to change it. Free Start writes nothing — say where you are and the valley answers.
    vi: Cảnh đã chọn sẽ giữ nguyên trong cuộc trò chuyện này. Bấm lại để đổi. Bắt Đầu Tự Do không viết gì cả — bạn nói mình đang ở đâu, thung lũng sẽ đáp lời.
