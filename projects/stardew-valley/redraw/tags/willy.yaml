# One block per expression, applied to every outfit. Only what changes between
# portraits belongs here: eyes, mouth, hands, gaze, blush intensity, and any
# effect the portrait draws.
#
# Source: "a genial closed-mouth smile; a closed-eyed rub at the bridge of her
# nose; an arms-crossed considering look, mouth flat; and a closed-eyed amused
# one with a hand at her hip. Nothing sharp in any of them and nothing angry."
