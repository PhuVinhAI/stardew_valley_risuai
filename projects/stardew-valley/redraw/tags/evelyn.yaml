# Evelyn — 12 portraits, 3 outfits, 4 expressions
#
# Every tag comes from source/characters/evelyn/content.md; no image was opened.
#
# A prompt is assembled as:
#   identity + outfits[<outfit>] + expressions[<expression>]
#
# Note the outfit ids: default, swimsuit, winter. She has no `beach` set.

character: evelyn
futanari: false

# True in every image. No framing, no pose, no expression here.
# Source: "Silver-grey hair in a short softly curled bob with a side-swept
# fringe. Pink-red eyes with long lashes and a warm flush across both cheeks.
# She is about 158 cm, 118-66-104 cm, a K-cup — enormous, heavy, and sitting
# high on her chest — with a soft waist, wide hips and thick pale thighs."
identity:
  # She is the oldest woman in the cast — "she has been dressing herself for
  # eighty years" — so the age tags are explicit. But "nobody meeting her for
  # the first time guesses how long she has been in this house", so no heavy
  # wrinkle or frail-body tags: an old woman who has kept her looks.
  - 1girl
  - solo
  - old woman
  - elderly
  - grey hair
  - silver hair
  - short hair
  - curly bob
  - swept bangs
  - red eyes
  - long eyelashes
  - blush
  - gigantic breasts
  # "enormous, heavy, and sitting high on her chest" — explicitly not sagging,
  # despite her age.
  - perky breasts
  - soft waist
  - wide hips
  - thick thighs
  - pale skin

outfits:
