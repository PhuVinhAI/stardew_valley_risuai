  winter:
    - pasties
    - heart pasties
    - black pasties
    - areolae
    - areola slip
    - maebari
    - heart maebari
    - topless
    - bottomless
    - bare shoulders
    - navel
    - bare legs

# One block per expression, applied to every outfit. Only what changes between
# portraits belongs here: eyes, mouth, hands, gaze, blush intensity, and any
# effect the portrait draws.
#
# Source: "an open-eyed fond look; a delighted open-mouthed smile with one hand
# raised to her cheek; a genuinely worried frown with her mouth flat; and a
# gentle closed-mouth smile. There is no angry expression in her at all."
expressions:
  fond:
    - upper body
    - soft smile
    - closed mouth
    - looking at viewer
    - open eyes
    - affectionate

  delighted:
    - upper body
    - happy
    - open mouth
    - wide smile
    - hand on own cheek
    - looking at viewer

  worried:
    - upper body
    - worried
    - frown
    - closed mouth
    - furrowed brow
    - looking at viewer

  gentle:
    - upper body
    - gentle smile
    - closed mouth
    - half-closed eyes
    - looking at viewer
    - serene

