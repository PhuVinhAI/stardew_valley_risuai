    - long sleeves
    - off-shoulder dress
    - underbust
    - breasts out of clothes
    - huge cleavage
    - bare shoulders
    - collarbone
    - choker
    - gemstone necklace
    - red gemstone
    - long skirt

  # "Around the house and in the snow alike she goes without any of it. Her whole
  # body is bare apart from two black heart-shaped covers stuck over the nipples
  # and a matching black heart low between her thighs — breasts, belly, hips and
  # legs entirely uncovered, the covers small enough that the areola shows
  # around the edges."
  swimsuit:
    - pasties
    - heart pasties
    - black pasties
    - areolae
    - areola slip
    - maebari
    - heart maebari
    - topless
    - bottomless
    - bare shoulders
    - navel
    - bare legs

  # "The winter version is identical and no warmer." Same tags as `swimsuit` by
