# One block per expression, applied to every outfit. Only what changes between
# portraits belongs here: eyes, mouth, hands, gaze, blush intensity, and any
# effect the portrait draws.
#
# Source: "a friendly open-eyed smile with a hand on her hip; a full open-mouthed
# laugh with one hand raised; a considering look with her hand at her chin; a
# side-on appraising glance back over her shoulder; an open-palmed greeting; a
# softer warm smile; and one genuine annoyed frown, turned away, mouth tight."
