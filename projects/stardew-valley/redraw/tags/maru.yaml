# One block per expression, applied to every outfit. Only what changes between
# portraits belongs here: eyes, mouth, hands, gaze, blush intensity, and any
# effect the portrait draws.
#
# Source: "a bright open-mouthed smile; a playful closed-eyed double peace sign;
# a surprised parted-lip look; a cheeky glance over lowered sunglasses; a shy
# hunch with both hands drawn together; a wry look aside; an eager grin; a
# pleased small smile; a thoughtful neutral face; and a flustered flailing
# recoil."
expressions:
  bright:
    - upper body
    - smile
    - open mouth
    - happy
    - looking at viewer
    - open eyes

  playful:
    - upper body
    - double v
    - v over eye
    - closed eyes
    - smile
    - open mouth

  surprised:
    - upper body
    - surprised
    - parted lips
