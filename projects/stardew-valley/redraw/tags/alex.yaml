# One block per expression. Only what changes between portraits belongs here:
# eyes, mouth, hands, gaze, blush intensity, and any effect the portrait draws.
#
# Source: "a cocky grin with a hand on her hip, a triumphant cheer with one fist
# up, a sheepish arm-behind-head pose, a playful wink while holding a gridball,
# an eager bright-eyed shout, an annoyed frown with both hands on her hips, a
# startled glance back over her shoulder, a flat unimpressed stare, and a
# straining flex with her teeth gritted."
expressions:
  cocky:
    - upper body
    - grin
    - teeth
    - confident
    - hand on hip
    - looking at viewer

  triumphant:
    - upper body
    - cheering
    - arm up
    - clenched hand
    - open mouth
    - happy

  sheepish:
    - upper body
    - embarrassed
    - arm behind head
    - wry smile
    - looking away
    - blush

  # "a playful wink while holding a gridball" — gridball reads as an American
  # football to a Danbooru-trained checkpoint.
  playful:
    - upper body
    - one eye closed
    - wink
    - grin
    - american football
    - holding ball

  eager:
    - upper body
    - excited
    - open mouth
    - shouting
    - sparkling eyes
    - leaning forward

  annoyed:
