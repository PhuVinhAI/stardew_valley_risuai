# Source: "Short blonde hair in a slightly messy bob pushed off her forehead.
# Green eyes under heavy lids with sharp red-brown liner, and a flush that never
# leaves her cheeks. She is about 168 cm, 116-72-110 cm, a K-cup, thick through
# the soft waist and wide across the hips." The habitual weight-on-one-leg,
# hand-on-hip stance is a pose, so it lives in the expression blocks instead.
identity:
  - 1girl
  - solo
  - mature female
  - blonde hair
  - short hair
  - bob cut
  - messy hair
  - forehead
  - green eyes
  - eyeliner
  - permanent blush
  - gigantic breasts
  - wide hips
