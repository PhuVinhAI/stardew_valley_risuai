# Pam — 15 portraits, 3 outfits, 5 expressions
#
# Every tag comes from source/characters/pam/content.md; no image was opened.
#
# A prompt is assembled as:
#   identity + outfits[<outfit>] + expressions[<expression>]

character: pam
futanari: false

