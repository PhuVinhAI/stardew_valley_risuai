# One block per expression, applied to every outfit. Only what changes between
# portraits belongs here: eyes, mouth, hands, gaze, blush intensity, and any
# effect the portrait draws.
#
# Source: "a flat unimpressed stare with one hand on her hip; a lazy half-lidded
# look with one arm hooked behind her head; an openly annoyed shout, mouth open,
# red anger marks flying off her temple, arms crossed under her breasts; and a
# narrow-eyed grumble with her arms still folded. One breaks the pattern
# entirely — a wide open grin with her eyes screwed shut and a thumbs-up, yellow
# lines radiating off her."
expressions:
  unimpressed:
    - upper body
    - unamused
    - half-closed eyes
    - closed mouth
    - hand on hip
    - looking at viewer

  thumbs-up:
    - upper body
    - grin
    - open mouth
    - closed eyes
    - thumbs up
    - emphasis lines

  arm-behind-head:
    - upper body
    - smirk
    - half-closed eyes
    - closed mouth
    - arm behind head
    - looking at viewer

  shouting:
    - upper body
    - shouting
    - angry
    - open mouth
    - anger vein
    - crossed arms
    - arm under breasts

  arms-folded:
