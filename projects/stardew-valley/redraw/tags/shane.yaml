# away, a glum downturned mouth, an irritated flash with pink marks flying off
# her head, a hand-on-hip stance that reads more braced than confident, and a
# startled open-mouthed jolt with two exclamation marks over her. Two poses break
# the pattern completely — she is holding one of her hens against her chest, eyes
# shut, smiling properly, and they are the only two where she looks happy. One
