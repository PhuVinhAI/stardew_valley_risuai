# One block per expression, applied to both outfits. Only what changes between
# portraits belongs here: eyes, mouth, gaze, blush intensity, and any effect the
# portrait draws. The prose does not assign the hand on the wheel or in the lap
# to any particular expression, so hands are left out of these blocks.
#
# Source: "a sullen downward look; a slightly softened version with the ghost of
# a smile; an openly displeased frown; and a narrow-eyed grumble aside. There is
# no bright or cheerful expression in her at all."
expressions:
  sullen:
    - upper body
    - sullen
    - frown
    - closed mouth
    - looking down
    - half-closed eyes

  softened:
    - upper body
    - light smile
    - closed mouth
    - looking at viewer
    - half-closed eyes
    - relaxed

  displeased:
    - upper body
    - angry
    - frown
    - furrowed brow
    - closed mouth
    - looking at viewer

  grumbling:
