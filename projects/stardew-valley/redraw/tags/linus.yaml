# One block per expression. Only what changes between portraits belongs here:
# eyes, mouth, hands, gaze, blush intensity, and any effect the portrait draws.
#
# Source: "a content open-eyed look with one hand at her hip, a cheerful
# closed-eyed smile with a small pointing gesture, a wary flat-mouthed stare at
# anyone she does not know, and a thoughtful one with her hand near her mouth."
expressions:
  content:
    - upper body
    - light smile
    - closed mouth
    - looking at viewer
    - hand on hip
    - calm

  cheerful:
    - upper body
    - happy
    - smile
    - closed eyes
    - pointing
    - index finger raised

  wary:
    - upper body
    - expressionless
    - closed mouth
    - looking at viewer
    - narrowed eyes
    - suspicious

  thoughtful:
    - upper body
    - thinking
    - hand near own mouth
    - closed mouth
    - looking to the side
    - half-closed eyes

  # "Two poses are cropped close — head, shoulders, and both arms folded across
  # her chest, holding her breasts against herself so nothing else shows. She
  # looks comfortable in those two, eyes shut in one, half-lidded and watchful in
  # the other."
  #
  # README lists `serene-portrait` and `quiet-portrait` as two of the five labels
  # whose second drawing the prose does not describe, and says to reuse the base
  # label's tags. There is no bare `serene` or `quiet` label in this card — only
  # the two `-portrait` ones — so a base block would sit UNUSED. Instead both are
  # tagged from the sentence above, which does split them: eyes shut here,
  # half-lidded and watchful in `quiet-portrait`. Both crop tighter than every
  # other portrait and the folded arms cover the chest, so the outfit block's
  # exposure tags are contradicted in these two by design.
  serene-portrait:
    - portrait
    - close-up
    - crossed arms
    - covering breasts
    - closed eyes
    - closed mouth
    - relaxed

  quiet-portrait:
    - portrait
    - close-up
    - crossed arms
    - covering breasts
    - half-closed eyes
    - closed mouth
    - looking at viewer

