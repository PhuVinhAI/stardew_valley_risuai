# One block per expression, applied to every outfit. Only what changes between
# portraits belongs here: eyes, mouth, hands, gaze, blush intensity, and any
# effect the portrait draws.
#
# Source: "a warm closed-mouth smile; a closed-eyed laugh with one hand raised
# to her mouth; a weary look with her cheek resting on her hand; a flat
# exasperated frown with both hands planted on her hips; and a brisker
# half-smile with one hand on her hip, the one that means she has already
# decided what happens next."
