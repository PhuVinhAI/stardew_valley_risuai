# One block per expression, applied to every outfit. Only what changes between
# portraits belongs here: eyes, mouth, hands, gaze, blush intensity, and any
# effect the portrait draws.
#
# Abigail's profile has no single sentence listing her portrait faces the way
# Marnie's does, so each block is built from the label on the curation sheet plus
# the range her personality and voice sections give it: "warm and playful, but
# also tired, prickly, defensive, embarrassed, or blunt", "She can tease, use dry
# humor, blurt out excitement, or become suddenly sincere. When embarrassed she
# may hedge, change the subject, laugh, or speak more softly. When angry she is
# clear rather than elegant."
expressions:
  composed:
    - upper body
    - neutral face
    - closed mouth
    - looking at viewer
    - calm

  # "blurt out excitement"
  celebratory:
    - upper body
    - excited
    - open mouth
    - wide smile
    - closed eyes
    - arm up

  # "When angry she is clear rather than elegant."
  annoyed:
    - upper body
    - annoyed
    - frown
    - closed mouth
    - half-closed eyes
    - furrowed brow

  # "defensive", "sometimes loses her nerve"
  uneasy:
    - upper body
    - worried
    - nervous
    - closed mouth
    - looking away
    - sweatdrop

  # "When embarrassed she may hedge, change the subject, laugh, or speak more
  # softly."
  bashful:
    - upper body
    - embarrassed
    - heavy blush
    - looking away
    - half-closed eyes
    - closed mouth

  # "She can tease, use dry humor"
  teasing:
    - upper body
    - smirk
    - half-closed eyes
    - looking at viewer
