# One block per expression, applied to every outfit. Only what changes between
# portraits belongs here: eyes, mouth, hands, gaze, blush intensity, and any
# effect the portrait draws.
#
# Source: "Nothing on her face is cheerful. A guarded closed-mouth look aimed
# slightly past you. A wry half-smile with one hand near her jaw. A flat level
# stare. A tense open-mouthed grimace, teeth showing. A startled parted-lip
# look, caught off guard. And a withdrawn one with her eyes closed and her hand
# at her cheek, which is the closest she gets to rest."
expressions:
