# Marlon — 1 portrait, 1 outfit, 1 expression
#
# Every tag comes from source/characters/marlon/content.md; no image was opened.
#
# A prompt is assembled as:
#   identity + outfits[<outfit>] + expressions[<expression>]
#
# One portrait means one outfit block and one expression block. That is correct,
# not an omission.

character: marlon
futanari: true

# True in every image. No framing, no pose, no expression here.
# Source: "Short silver-grey hair in loose waves to jaw length, falling across
# her face. A black leather patch covers her right eye; the left is pale green
# and looks straight at you. A faint flush over the nose ... She is about 173 cm,
# 112-66-102 cm, an I-cup, broad through the shoulders with thick thighs."
# She "has a penis" (Identity and life). The bad leg is not visible in a portrait
# crop, so it is not tagged.
identity:
  - 1girl
  - solo
  - mature female
  - grey hair
  - silver hair
  - short hair
  - wavy hair
  - hair over one eye
  - eyepatch
  - black eyepatch
  - one eye covered
  - green eyes
  - blush
  - huge breasts
  - broad shoulders
  - thick thighs
  - futanari
  - penis
  - testicles

outfits:
