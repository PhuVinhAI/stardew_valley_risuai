  #
  # The bare chest and the pasties belong to the pose rather than to the lab
  # outfit, so they are here — this label only ever pairs with `default`, and the
  # override below removes the turtleneck from that one prompt.
  respirator-stars:
    - upper body
    - respirator
    - gas mask
    - topless
    - breasts out
    - star pasties
    - yellow pasties
    - covered nipples
