# One block per expression, applied to every outfit. Only what changes between
# portraits belongs here: eyes, mouth, hands, gaze, blush intensity, and any
# effect the portrait draws.
#
# Source: "a composed small smile with her arms crossed; a thoughtful hand raised
# to her mouth; an unimpressed half-lidded stare; a hands-on-hips stance
# mid-explanation; a flat disapproving frown; a satisfied closed-mouth smile; a
# distracted glance away at something more interesting than you."
expressions:
  composed:
    - upper body
    - small smile
    - closed mouth
    - crossed arms
    - arms under breasts
    - looking at viewer

  hand-to-mouth:
    - upper body
    - thoughtful
    - hand to own mouth
    - closed mouth
    - half-closed eyes
    - looking at viewer

  unimpressed:
