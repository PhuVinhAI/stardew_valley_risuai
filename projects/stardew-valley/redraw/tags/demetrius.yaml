# Per-portrait repairs. `respirator-stars` is a topless pose, but its only outfit
# is the lab turtleneck, so plain concatenation would ask for a covered chest and
# a bare one in the same prompt. The prose says "her breasts completely bare apart
# from two yellow star-shaped covers", so the shirt goes.
overrides:
  default.respirator-stars:
    drop:
      - black turtleneck
      - sleeveless turtleneck
      - ribbed shirt
      - crop top
      - no bra
      - underboob

