#
# Every tag comes from source/characters/demetrius/content.md; no image was
# opened.
#
# A prompt is assembled as:
#   identity + outfits[<outfit>] + expressions[<expression>]
#
# She has no `nude` outfit, so no block states the state of the penis; the
# anatomy tags sit in `identity` where every render picks them up.

